        <p class="text-xs font-bold uppercase tracking-widest text-blue-700">Kanye Series</p>

      <div class="hidden text-right sm:block"><div data-admin-name class="font-bold">Admin</div><div class="text-xs text-slate-500">Administrator</div></div>

<main id="protectedApp" class="hidden lg:ml-72">
  <div class="mx-auto max-w-[1600px] p-4 pb-28 sm:p-6 sm:pb-28">

<div class="mb-5 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
  <div><h2 class="text-2xl font-black">Products</h2><p class="text-sm text-slate-500">Manage the live product catalogue.</p></div>
  <a href="admin-add-product.html" class="rounded-xl bg-blue-800 px-4 py-3 text-center font-bold text-white"><i class="bi bi-plus-lg"></i> Add Product</a>
</div>
<input id="search" type="search" placeholder="Search products..." class="mb-5 w-full rounded-xl border bg-white p-3 focus-ring" aria-label="Search products">
<div id="productList" class="card overflow-hidden rounded-2xl border bg-white"><div class="p-6 text-slate-500">Loading...</div></div>

  </div>
</main>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBK-HHFid2F9SY1rtGsSO3boUFZihyOpTQ",
  authDomain: "goldai-58550.firebaseapp.com",
  projectId: "goldai-58550",databaseURL:"https://goldai-58550-default-rtdb.firebaseio.com",
  storageBucket: "goldai-58550.firebasestorage.app",
  messagingSenderId: "726592521265",
  appId: "1:726592521265:web:8aca7282b6b4aec8c9c110",
  measurementId: "G-23MEZJVM6Z"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const values = snap => snap.exists()
  ? Object.entries(snap.val() || {}).map(([key, val]) => ({ ...(val || {}), _key: key }))
  : [];

async function requireAdmin(user){
  if(!user){ location.replace("admin-login.html"); return false; }
  const userProfile = await get(ref(db, "users/" + user.uid));
  const userData = userProfile.exists() ? userProfile.val() : null;
  if(!userData || userData.role !== "admin"){
    await Swal.fire({icon:"error", title:"Access Denied", text:"This account is not authorized to use the admin portal.", confirmButtonColor:"#1d4ed8"});
    location.replace("admin-login.html");
    return false;
  }
  const name = userData.name || user.displayName || user.email || "Admin";
  document.querySelectorAll("[data-admin-name]").forEach(el => el.textContent = name);
  const photo = userData.photoURL || user.photoURL;
  if(photo){
    document.querySelectorAll("[data-admin-avatar]").forEach(img => { img.src = photo; img.classList.remove("hidden"); });
    document.querySelectorAll("[data-avatar-icon]").forEach(i => i.classList.add("hidden"));
  }
  return true;
}

onAuthStateChanged(auth, async user => {
  try{
    if(await requireAdmin(user)){
      document.getElementById("protectedApp").classList.remove("hidden");
      await initPage();
    }
  }catch(error){
    console.error("Admin authorization error:", error);
    Swal.fire({icon:"error", title:"Unable to verify access", text:"Please check your connection and try again.", confirmButtonColor:"#1d4ed8"});
  }
});

async function doSignOut(){
  const result = await Swal.fire({
    icon:"question", title:"Sign out of admin portal?",
    text:"You will need to sign in again to continue.",
    showCancelButton:true, confirmButtonText:"Sign Out", cancelButtonText:"Stay",
    confirmButtonColor:"#1d4ed8"
  });
  if(result.isConfirmed){ await signOut(auth); location.replace("admin-login.html"); }
}
document.querySelectorAll("[data-signout]").forEach(btn => btn.addEventListener("click", doSignOut));

const drawer = document.getElementById("drawer");
const shade = document.getElementById("shade");
document.getElementById("openMenu")?.addEventListener("click", () => {drawer.classList.add("open"); shade.classList.remove("hidden");});
document.getElementById("closeMenu")?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});
shade?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});


let products=[];
const productImage=p=>Array.isArray(p.images)?(p.images[0]||""):((p.images&&Object.values(p.images)[0])||"");
const renderProducts=()=>{
 const q=search.value.trim().toLowerCase();
 const arr=products.filter(p=>[p.name,p.category,p.description].join(" ").toLowerCase().includes(q));
 productList.innerHTML=arr.map(p=>`
 <div class="flex flex-col gap-4 border-b p-4 sm:flex-row sm:items-center">
  <img src="${productImage(p)}" onerror="this.style.display='none'" alt="" class="h-16 w-16 rounded-xl bg-slate-100 object-cover">
  <div class="min-w-0 flex-1"><b class="block truncate">${p.name||"Unnamed product"}</b><p class="text-sm text-slate-500">${p.category||"-"} - UGX ${new Intl.NumberFormat("en-UG").format(Number(p.price)||0)}</p><p class="text-xs text-slate-400">Stock: ${p.stock??0}</p></div>
  <div class="flex gap-2"><a href="admin-edit-product.html?id=${encodeURIComponent(p.id||p._key)}" class="rounded-lg border px-3 py-2 font-semibold">Edit</a><button type="button" data-delete="${p.id||p._key}" class="rounded-lg bg-red-50 px-3 py-2 font-semibold text-red-700">Delete</button></div>
 </div>`).join("") || `<div class="p-6 text-center text-slate-500">No products found.</div>`;
 document.querySelectorAll("[data-delete]").forEach(btn=>btn.addEventListener("click",async()=>{
   const ok=await Swal.fire({icon:"warning",title:"Delete product?",text:"This cannot be undone.",showCancelButton:true,confirmButtonText:"Delete",confirmButtonColor:"#dc2626"});
   if(ok.isConfirmed) await remove(ref(db,"products/"+btn.dataset.delete));
 }));
};
onValue(ref(db,"products"),snap=>{products=values(snap);renderProducts();});
search.addEventListener("input",renderProducts);
async function initPage(){}

</script>
</body>
</html>
