<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Kanye Series</title>
<meta name="theme-color" content="#1e3a8a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kanye Series Admin"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./images/logo.png">
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer src="./js/pwa.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body class="flex min-h-screen items-center justify-center bg-slate-100 p-5">
<form id="loginForm" class="w-full max-w-md rounded-3xl bg-white p-7 shadow-xl">
<div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-white shadow-sm"><img src="./images/logo.png" alt="Kanye Series" class="h-12 w-12 object-contain"></div>
<h1 class="mt-5 text-center text-2xl font-black">Kanye Series Admin</h1>
<p class="mt-2 text-center text-sm text-slate-500">Authorized administrators only.</p>
<label class="mt-6 block text-sm font-bold">Email<input id="email" type="email" required autocomplete="username" class="mt-2 w-full rounded-xl border p-3"></label>
<label class="mt-4 block text-sm font-bold">Password<input id="password" type="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border p-3"></label>
<label class="mt-4 flex items-center gap-2 text-sm"><input id="remember" type="checkbox" checked> Keep me signed in</label>
<button type="submit" id="loginBtn" class="mt-5 w-full rounded-xl bg-blue-800 p-3 font-bold text-white">Sign In</button>
</form>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBK-HHFid2F9SY1rtGsSO3boUFZihyOpTQ",
  authDomain: "goldai-58550.firebaseapp.com",
  projectId: "goldai-58550",databaseURL:"https://goldai-58550-default-rtdb.firebaseio.com",
  storageBucket: "goldai-58550.firebasestorage.app",
  messagingSenderId: "726592521265",
  appId: "1:726592521265:web:8aca7282b6b4aec8c9c110",
  measurementId: "G-23MEZJVM6Z"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
onAuthStateChanged(auth, async user=>{
 if(!user)return;
 const s=await get(ref(db,"users/"+user.uid));
 if(s.exists() && s.val()?.role==="admin") location.replace("admin-index.html");
});
loginForm.addEventListener("submit",async e=>{
 e.preventDefault(); loginBtn.disabled=true; loginBtn.textContent="Signing in...";
 try{
  const cred=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);
  const s=await get(ref(db,"users/"+cred.user.uid));
  if(!s.exists() || s.val()?.role!=="admin"){
    await signOut(auth); throw new Error("NOT_ADMIN");
  }
  location.replace("admin-index.html");
 }catch(err){
  console.error(err);
  Swal.fire({icon:"error",title:"Sign in failed",text:err.message==="NOT_ADMIN"?"This account is not authorized.":"Check your email, password, and connection.",confirmButtonColor:"#1d4ed8"});
 }finally{loginBtn.disabled=false;loginBtn.textContent="Sign In";}
});
</script></body></html>
