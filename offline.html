<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Offline | Kanye Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <div class="mx-auto flex min-h-screen max-w-4xl items-center justify-center px-5 py-12">
    <div class="w-full max-w-xl overflow-hidden rounded-[28px] border border-slate-200 bg-white/90 shadow-2xl backdrop-blur-sm">
      <div class="bg-gradient-to-r from-blue-950 via-blue-900 to-blue-800 px-6 py-6 text-white">
        <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-white text-blue-900 shadow-md">
            <img src="./images/logo2.png" alt="Kanye Series" class="h-8 w-8 object-contain">
          </div>
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-blue-100">Kanye Series</p>
            <h1 class="text-xl font-black tracking-tight">You are offline</h1>
          </div>
        </div>
      </div>

      <div class="px-6 py-8 text-center sm:px-8">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-blue-50 text-blue-700 shadow-inner">
          <i class="bi bi-wifi-off text-4xl"></i>
        </div>

        <h2 class="mt-6 text-2xl font-black tracking-tight text-slate-950">Connection lost</h2>
        <p class="mt-3 text-sm leading-6 text-slate-600">
          You are currently offline. Some previously visited content may still be available, but live features like checkout, authentication, and product updates require an internet connection.
        </p>

        <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:justify-center">
          <button id="retryConnection" type="button" class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-800 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-800/20 transition hover:bg-blue-900">
            <i class="bi bi-arrow-clockwise"></i>
            Retry connection
          </button>
          <a href="./index.html" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">
            <i class="bi bi-house-door"></i>
            Go home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const retryButton = document.getElementById('retryConnection');
    retryButton?.addEventListener('click', async () => {
      if (navigator.onLine) {
        window.location.href = './index.html';
        return;
      }

      try {
        const response = await fetch('./index.html', { cache: 'no-store' });
        if (response.ok) {
          window.location.href = './index.html';
        }
      } catch (error) {
        retryButton.innerHTML = '<i class="bi bi-wifi-off"></i> Still offline';
      }
    });
  </script>
</body>
</html>
