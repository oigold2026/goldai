<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    get,
    set,
    remove,
    onValue,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyBK-HHFid2F9SY1rtGsSO3boUFZihyOpTQ",

    authDomain: "goldai-58550.firebaseapp.com",

    databaseURL: "https://goldai-58550-default-rtdb.firebaseio.com",

    projectId: "goldai-58550",

    storageBucket: "goldai-58550.firebasestorage.app",

    messagingSenderId: "726592521265",

    appId: "1:726592521265:web:8aca7282b6b4aec8c9c110",

    measurementId: "G-23MEZJVM6Z"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =====================================================
   GLOBAL STATE
===================================================== */

let user = null;

let item = null;

let wished = false;

let images = [];

let currentImageIndex = 0;
let wishlistUnsubscribe = null;
let cartUnsubscribe = null;
let stockUnsubscribe = null;
let productCartUnsubscribe = null;
let productCartQuantity = 0;

/* =========================================
   NAVIGATION COUNTS
========================================= */

const wishlistCount = document.getElementById("wishlistCount");
const cartCount = document.getElementById("cartCount");


/* =========================================
   UPDATE COUNT
========================================= */

function updateCount(element, count) {

  count = Math.max(0, Number(count) || 0);

    element.textContent = count > 99 ? "99+" : count;

  if (count > 0) {
    element.classList.remove("hidden");
  } else {
    element.classList.add("hidden");
  }
}


/* =========================================
   WISHLIST REALTIME COUNT
========================================= */

function startWishlistCount(uid) {

  // Remove previous listener
  if (wishlistUnsubscribe) {
    wishlistUnsubscribe();
    wishlistUnsubscribe = null;
  }

  const wishlistRef = ref(db, `wishlists/${uid}`);

  wishlistUnsubscribe = onValue(
    wishlistRef,

    snapshot => {

      const data = snapshot.val() || {};

      const count = Object.values(data)
        .filter(value => Boolean(value))
        .length;

      updateCount(wishlistCount, count);
    },

    error => {

      console.error(
        "Wishlist count error:",
        error
      );

      updateCount(wishlistCount, 0);
    }
  );
}


/* =========================================
   CART REALTIME COUNT
========================================= */

function startCartCount(uid) {

  // Remove previous listener
  if (cartUnsubscribe) {
    cartUnsubscribe();
    cartUnsubscribe = null;
  }

  const cartRef = ref(db, `carts/${uid}`);

  cartUnsubscribe = onValue(
    cartRef,

    snapshot => {

      const data = snapshot.val() || {};

      let count = 0;

      Object.values(data).forEach(item => {

        const quantity =
          Number(item?.quantity) || 0;

        count += Math.max(0, quantity);

      });

      updateCount(cartCount, count);
    },

    error => {

      console.error(
        "Cart count error:",
        error
      );

      updateCount(cartCount, 0);
    }
  );
}


/* =========================================
   AUTHENTICATION
========================================= */

onAuthStateChanged(auth, userData => {

  user = userData || null;

  // User logged out
  if (!user) {

    if (wishlistUnsubscribe) {
      wishlistUnsubscribe();
      wishlistUnsubscribe = null;
    }

    if (cartUnsubscribe) {
      cartUnsubscribe();
      cartUnsubscribe = null;
    }

    updateCount(wishlistCount, 0);
    updateCount(cartCount, 0);

    return;
  }


  // User logged in
  startWishlistCount(user.uid);
  startCartCount(user.uid);

});

/* =====================================================
   DOM HELPER
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   URL PRODUCT ID
===================================================== */

const id =
    new URLSearchParams(
        location.search
    ).get("id");


/* =====================================================
   CURRENCY
===================================================== */

function money(value) {

    const number =
        Number(value) || 0;

    return `UGX ${number.toLocaleString("en-UG")}`;
}


/* =====================================================
   YEAR
===================================================== */

$("year").textContent =
    new Date().getFullYear();


/* =====================================================
   ALERT
===================================================== */

function message(
    title,
    text = "",
    icon = "info"
) {

    if (window.Swal) {

        return Swal.fire({
            title,
            text,
            icon,
            confirmButtonColor:
                "#1d4ed8"
        });

    }

    alert(
        text
            ? `${title}\n${text}`
            : title
    );

}


/* =====================================================
   GET PRODUCT IMAGES
===================================================== */

function getImages(product) {

    const result = [];


    /*
       images: []
    */

    if (
        Array.isArray(product?.images)
    ) {

        product.images.forEach(image => {

            if (
                typeof image === "string" &&
                image.trim()
            ) {

                result.push(
                    image.trim()
                );

            }

        });

    }


    /*
       images: {}
    */

    else if (
        product?.images &&
        typeof product.images === "object"
    ) {

        Object.values(
            product.images
        ).forEach(image => {

            if (
                typeof image === "string" &&
                image.trim()
            ) {

                result.push(
                    image.trim()
                );

            }

        });

    }


    /*
       image
    */

    if (
        typeof product?.image === "string" &&
        product.image.trim()
    ) {

        result.push(
            product.image.trim()
        );

    }


    /*
       imageUrl
    */

    if (
        typeof product?.imageUrl === "string" &&
        product.imageUrl.trim()
    ) {

        result.push(
            product.imageUrl.trim()
        );

    }


    /*
       Remove duplicates.
    */

    return [
        ...new Set(result)
    ];

}


/* =====================================================
   UPDATE MAIN IMAGE
===================================================== */

function updateMainImage(index) {

    if (!images.length) {
        return;
    }


    currentImageIndex =
        Math.max(
            0,
            Math.min(
                index,
                images.length - 1
            )
        );


    const image =
        $("image");


    image.classList.add(
        "fade"
    );


    setTimeout(() => {

        image.src =
            images[currentImageIndex];

        image.alt =
            item?.name ||
            "Product";


        image.onload = () => {

            image.classList.remove(
                "fade"
            );

        };

    }, 120);


    /*
       Counter
    */

    $("imageCounter").textContent =
        `${currentImageIndex + 1} / ${images.length}`;


    /*
       Update thumbnails.
    */

    document
        .querySelectorAll(
            ".product-thumbnail"
        )
        .forEach(
            (thumbnail, thumbnailIndex) => {

                thumbnail.classList.toggle(
                    "active",
                    thumbnailIndex ===
                    currentImageIndex
                );

                thumbnail.setAttribute(
                    "aria-current",
                    thumbnailIndex ===
                    currentImageIndex
                        ? "true"
                        : "false"
                );

            }
        );


    /*
       Scroll active thumbnail
       into view.
    */

    const activeThumbnail =
        document.querySelector(
            `.product-thumbnail[data-index="${currentImageIndex}"]`
        );


    activeThumbnail?.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center"
    });

}


/* =====================================================
   RENDER THUMBNAILS
===================================================== */

function renderThumbnails() {

    const container =
        $("thumbnailContainer");


    container.innerHTML = "";


    if (!images.length) {

        $("otherImagesSection")
            .classList.add("hidden");

        return;
    }


    /*
       Hide "Other Images" if
       there is only one image.
    */

    if (images.length <= 1) {

        $("otherImagesSection")
            .classList.add("hidden");

    } else {

        $("otherImagesSection")
            .classList.remove("hidden");

    }


    $("imageCountText").textContent =
        `${images.length} image${
            images.length === 1
                ? ""
                : "s"
        }`;


    images.forEach(
        (image, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "product-thumbnail focus-ring active:scale-95 relative h-20 w-20 shrink-0 overflow-hidden rounded-xl border-2 border-transparent bg-slate-100 sm:h-24 sm:w-24";


            button.dataset.index =
                index;


            button.setAttribute(
                "aria-label",
                `View product image ${index + 1}`
            );


            button.innerHTML = `

                <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(item?.name || "Product")} image ${index + 1}"
                    class="h-full w-full object-cover"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >

            `;


            button.addEventListener(
                "click",
                () => {

                    updateMainImage(
                        index
                    );

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function updateStockDisplay() {

    if (!item) {
        return;
    }


    const stock =
        Number(item.stock);


    const remainingStock =
        Number.isFinite(stock)
            ? Math.max(0, stock - productCartQuantity)
            : null;


    const available =
        Number.isFinite(remainingStock)
            ? remainingStock > 0
            : true;


    $("stock").textContent =
        Number.isFinite(remainingStock)
            ? available
                ? `${remainingStock} available`
                : "Out of stock"
            : "Availability varies";


    $("stock").className =
        `mt-3 text-sm font-bold ${
            available
                ? "text-emerald-700"
                : "text-red-600"
        }`;


    $("cartButton").disabled =
        !available;


    $("cartButton").innerHTML =
        available

            ? `<i class="bi bi-cart-plus mr-2"></i>Add to cart`

            : `<i class="bi bi-x-circle mr-2"></i>Out of stock`;

}

function render() {

    $("loading")
        .classList
        .add("hidden");


    if (!item) {

        $("notFound")
            .classList
            .remove("hidden");

        return;
    }


    $("product")
        .classList
        .remove("hidden");


    /*
       Images
    */

    images =
        getImages(item);


    if (!images.length) {

        images = [
            "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=900&auto=format&fit=crop&q=75"
        ];

    }


    currentImageIndex = 0;


    renderThumbnails();


    $("image").src =
        images[0];

    $("image").alt =
        item.name ||
        "Product";


    $("imageCounter").textContent =
        `1 / ${images.length}`;


    /*
       Product information
    */

    $("name").textContent =
        item.name ||
        "Unnamed product";


    $("category").textContent =
        item.category ||
        "Product";


    $("price").textContent =
        money(item.price);


    updateStockDisplay();


    $("description").textContent =
        item.description ||
        "No description has been provided for this product.";


    /*
       Wishlist button
    */

    updateWishlistButton();


    /*
       AOS refresh
    */

    if (window.AOS) {

        AOS.refresh();

    }

}


/* =====================================================
   WISHLIST BUTTON
===================================================== */

function updateWishlistButton() {

    $("wishlistButton").innerHTML =

        wished

            ? `
                <i
                    class="bi bi-heart-fill mr-2 text-red-600"
                ></i>
                Remove from wishlist
              `

            : `
                <i
                    class="bi bi-heart mr-2"
                ></i>
                Add to wishlist
              `;

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function load() {

    if (stockUnsubscribe) {
        stockUnsubscribe();
        stockUnsubscribe = null;
    }

    if (productCartUnsubscribe) {
        productCartUnsubscribe();
        productCartUnsubscribe = null;
    }

    productCartQuantity = 0;

    if (!id) {

        render();

        return;
    }


    try {

        console.log(
            "Loading product:",
            id
        );


        /*
           Fetch product from:

           products/PRODUCT_ID
        */

        const snapshot =
            await get(
                ref(
                    db,
                    `products/${id}`
                )
            );


        if (
            snapshot.exists()
        ) {

            item = {
                id,
                ...(snapshot.val() || {})
            };

        } else {

            item = null;

        }


        if (item) {

            stockUnsubscribe = onValue(
                ref(db, `products/${id}/stock`),

                stockSnapshot => {

                    if (stockSnapshot.exists()) {
                        item.stock = stockSnapshot.val();
                    } else {
                        delete item.stock;
                    }

                    updateStockDisplay();

                },

                error => {

                    console.error(
                        "Product stock error:",
                        error
                    );

                }
            );

            if (user) {

                productCartUnsubscribe = onValue(
                    ref(db, `carts/${user.uid}`),

                    cartSnapshot => {

                        const cartItems = cartSnapshot.val() || {};
                        const cartItem = cartItems[id] || {};

                        productCartQuantity = Math.max(
                            0,
                            Math.floor(Number(cartItem.quantity) || 0)
                        );

                        updateStockDisplay();

                    },

                    error => {

                        console.error(
                            "Product cart quantity error:",
                            error
                        );

                    }
                );

            }

        }


        /*
           Load wishlist state
           only when logged in.
        */

        if (
            user &&
            item
        ) {

            const wishlistSnapshot =
                await get(
                    ref(
                        db,
                        `wishlists/${user.uid}/${id}`
                    )
                );


            wished =
                wishlistSnapshot.exists() &&
                Boolean(
                    wishlistSnapshot.val()
                );

        }


        render();


    } catch (error) {

        console.error(
            "Product loading error:",
            error
        );


        item = null;


        render();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async authenticatedUser => {

        user =
            authenticatedUser || null;


        await load();

    }
);


/* =====================================================
   CART
===================================================== */

$("cartButton")
    .addEventListener(
        "click",
        async () => {

            if (!user) {

                location.href =
                    "login.html";

                return;
            }


            if (!item) {
                return;
            }


            const stock =
                Number(item.stock);


            if (
                Number.isFinite(stock) &&
                stock <= 0
            ) {

                message(
                    "Out of stock",
                    "This product is currently unavailable.",
                    "warning"
                );

                return;
            }


            if (
                Number.isFinite(stock) &&
                productCartQuantity + 1 > stock
            ) {

                message(
                    "Stock limit reached",
                    `Only ${stock} item${stock === 1 ? "" : "s"} available.`,
                    "info"
                );

                return;
            }


            const button =
                $("cartButton");


            button.disabled = true;


            try {

                const cartRef =
                    ref(
                        db,
                        `carts/${user.uid}/${id}`
                    );


                const snapshot =
                    await get(cartRef);


                const old =
                    snapshot.val() || {};


                const oldQuantity =
                    Math.max(
                        0,
                        Number(
                            old.quantity
                        ) || 0
                    );


                const quantity =
                    oldQuantity + 1;


                await set(
                    cartRef,
                    {

                        productId:
                            String(id),

                        name:
                            item.name ||
                            "Unnamed product",

                        price:
                            Number(item.price) ||
                            0,

                        image:
                            images[0] || "",

                        quantity,

                        addedAt:
                            old.addedAt ||
                            Date.now()

                    }
                );


                await message(
                    "Added to cart",
                    `${item.name || "Product"} was added to your cart.`,
                    "success"
                );


            } catch (error) {

                console.error(
                    "Add to cart error:",
                    error
                );


                await message(
                    "Could not add to cart",
                    "Please try again.",
                    "error"
                );

            } finally {

                button.disabled =
                    false;

            }

        }
    );


/* =====================================================
   WISHLIST
===================================================== */

$("wishlistButton")
    .addEventListener(
        "click",
        async () => {

            if (!user) {

                location.href =
                    "login.html";

                return;
            }


            if (!item) {
                return;
            }


            const button =
                $("wishlistButton");


            button.disabled =
                true;


            try {

                const wishlistRef =
                    ref(
                        db,
                        `wishlists/${user.uid}/${id}`
                    );


                if (wished) {

                    await remove(
                        wishlistRef
                    );


                    wished =
                        false;


                    await message(
                        "Removed from wishlist",
                        "The product has been removed from your wishlist.",
                        "success"
                    );

                } else {

                    await set(
                        wishlistRef,
                        true
                    );


                    wished =
                        true;


                    await message(
                        "Added to wishlist",
                        "The product has been saved to your wishlist.",
                        "success"
                    );

                }


                updateWishlistButton();


            } catch (error) {

                console.error(
                    "Wishlist error:",
                    error
                );


                await message(
                    "Wishlist update failed",
                    "Please try again.",
                    "error"
                );

            } finally {

                button.disabled =
                    false;

            }

        }
    );


/* =====================================================
   IMAGE NAVIGATION
===================================================== */

$("previousImage")
    .addEventListener(
        "click",
        () => {

            if (
                images.length <= 1
            ) {
                return;
            }


            const nextIndex =
                currentImageIndex <= 0

                    ? images.length - 1

                    : currentImageIndex - 1;


            updateMainImage(
                nextIndex
            );

        }
    );


$("nextImage")
    .addEventListener(
        "click",
        () => {

            if (
                images.length <= 1
            ) {
                return;
            }


            const nextIndex =
                currentImageIndex >=
                images.length - 1

                    ? 0

                    : currentImageIndex + 1;


            updateMainImage(
                nextIndex
            );

        }
    );


/* =====================================================
   KEYBOARD IMAGE NAVIGATION
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
           Don't interfere with
           form inputs.
        */

        if (
            ["INPUT", "TEXTAREA", "SELECT"]
                .includes(
                    document.activeElement?.tagName
                )
        ) {
            return;
        }


        if (
            event.key === "ArrowLeft"
        ) {

            $("previousImage")
                .click();

        }


        if (
            event.key === "ArrowRight"
        ) {

            $("nextImage")
                .click();

        }

    }
);


/* =====================================================
   AOS INITIALIZATION
===================================================== */

if (window.AOS) {

    AOS.init({

        duration: 700,

        easing:
            "ease-out-cubic",

        once: true,

        offset: 70,

        delay: 50

    });

}

</script>
