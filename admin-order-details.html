/*
 * KANYE SERIES - ADMIN ORDER DETAILS
 * Firebase Authentication + Realtime Database only.
 * Images are read from Cloudinary URLs when present.
 */

  runTransaction

  storageBucket: "goldai-58550.firebasestorage.app",

  measurementId: "G-23MEZJVM6Z"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const protectedApp = document.getElementById("protectedApp");

const STATUS_OPTIONS = [
  "pending",
  "confirmed",
  "delivered",
  "cancelled"
];

const PAYMENT_OPTIONS = [
  "pending",
  "paid",
  "failed",
  "refunded"
];

const money = value =>
  `UGX ${new Intl.NumberFormat("en-UG").format(Number(value) || 0)}`;

const escapeHtml = value =>
  String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

function formatDate(value) {
  const timestamp = Number(value);
  if (!Number.isFinite(timestamp) || timestamp <= 0) return "-";
  return new Intl.DateTimeFormat("en-UG", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(new Date(timestamp));
}

function normalizeItems(items) {
  if (!items) return [];

  if (Array.isArray(items)) {
    return items.filter(item => item && typeof item === "object");
  }

  if (typeof items === "object") {
    return Object.entries(items).map(([key, item]) => ({
      ...(item || {}),
      productId: item?.productId || key
    }));
  }

  return [];
}

function getItemName(item) {
  return item?.name || item?.productName || "Product";
}

function getItemImage(item) {
  if (Array.isArray(item?.images) && item.images.length) return item.images[0];
  return item?.image || item?.imageUrl || "";
}

function getItemPrice(item) {
  return Number(item?.price ?? item?.unitPrice ?? 0) || 0;
}

function getItemQuantity(item) {
  return Math.max(1, Number(item?.quantity ?? item?.qty ?? 1) || 1);
}

async function adjustOrderStock(order, direction) {
  const changed = [];
  let stockFailure = null;
  const productsSnapshot = await get(ref(db, "products"));
  const productRecords = productsSnapshot.exists() ? productsSnapshot.val() || {} : {};
  const resolveProductKey = (productId, item) => {
    const requestedName = String(item?.name || item?.productName || "").trim().toLowerCase();
    const direct = productRecords[productId];
    if (direct) {
      const directId = String(direct.id || direct.productId || "");
      const directName = String(direct.name || "").trim().toLowerCase();
      if ((!directId || directId === productId) && (!requestedName || directName === requestedName)) {
        return productId;
      }
    }
    const match = Object.entries(productRecords).find(([key, product]) => {
      const storedId = String(product?.id || product?.productId || "");
      const name = String(product?.name || "").trim().toLowerCase();
      return storedId === productId || (requestedName && name === requestedName);
    });
    return match ? match[0] : productId;
  };
  try {
    for (const item of normalizeItems(order.items)) {
      const quantity = getItemQuantity(item);
      const requestedProductId = String(item.productId || item.id || "");
      const productId = resolveProductKey(requestedProductId, item);
      if (!requestedProductId || quantity <= 0) continue;

      const result = await runTransaction(ref(db, `products/${productId}/stock`), stock => {
        const current = Number(stock);
        if (!Number.isFinite(current)) {
          stockFailure = { available: null, requested: quantity, productId };
          return stock;
        }
        if (direction === "deduct" && current < quantity) {
          stockFailure = { available: current, requested: quantity, productId };
          return;
        }
        return direction === "deduct" ? current - quantity : current + quantity;
      });

      if (!result.committed) {
        throw new Error(direction === "deduct"
          ? `${stockFailure?.available === null ? "STOCK_UNAVAILABLE" : "INSUFFICIENT_STOCK"}:${stockFailure?.productId || productId}:${stockFailure?.available ?? 0}:${stockFailure?.requested ?? quantity}`
          : `STOCK_UPDATE_FAILED:${productId}`);
      }
      changed.push({ productId, quantity });
    }
  } catch (error) {
    for (const item of changed.reverse()) {
      await runTransaction(ref(db, `products/${item.productId}/stock`), stock => {
        const current = Number(stock);
        if (!Number.isFinite(current)) return stock;
        return direction === "deduct"
          ? current + item.quantity
          : Math.max(0, current - item.quantity);
      });
    }
    throw error;
  }
}

async function getAdminRecord(uid) {
  const userSnap = await get(ref(db, `users/${uid}`));
  if (!userSnap.exists()) return null;
  const user = userSnap.val() || {};
  if (String(user.role || "").toLowerCase() !== "admin") return null;
  if (user.active === false) return null;
  return user;
}

async function requireAdmin(user) {
  if (!user) {
    location.replace("admin-login.html");
    return false;
  }

  const adminRecord = await getAdminRecord(user.uid);

  if (!adminRecord) {
    await Swal.fire({
      icon: "error",
      title: "Access Denied",
      text: "This account is not authorized to use the admin portal.",
      confirmButtonColor: "#1d4ed8"
    });
    location.replace("admin-login.html");
    return false;
  }

  const name =
    adminRecord.name ||
    user.displayName ||
    user.email ||
    "Admin";

  document.querySelectorAll("[data-admin-name]")
    .forEach(el => el.textContent = name);

  const photo = adminRecord.photoURL || user.photoURL;

  if (photo) {
    document.querySelectorAll("[data-admin-avatar]").forEach(img => {
      img.src = photo;
      img.classList.remove("hidden");
      img.onerror = () => {
        img.classList.add("hidden");
        document.querySelectorAll("[data-avatar-icon]")
          .forEach(icon => icon.classList.remove("hidden"));
      };
    });

    document.querySelectorAll("[data-avatar-icon]")
      .forEach(icon => icon.classList.add("hidden"));
  }

  return true;
}

function getRequestedOrderId() {
  const params = new URLSearchParams(location.search);
  return params.get("id") || params.get("orderId") || "";
}

function getRequestedUserId() {
  const params = new URLSearchParams(location.search);
  return params.get("uid") || params.get("userId") || "";
}

/*
 * The current Kanye Series database structure is:
 *
 * orders/
 *   USER_UID/
 *     ORDER_ID/
 *
 * If uid is supplied in the URL, read only that branch.
 * Otherwise, locate the order ID under orders/.
 */
async function findOrder(orderId, userId = "") {
  if (!orderId) return null;

  if (userId) {
    const directSnap = await get(ref(db, `orders/${userId}/${orderId}`));
    if (directSnap.exists()) {
      return {
        path: `orders/${userId}/${orderId}`,
        data: directSnap.val() || {}
      };
    }
  }

  const ordersSnap = await get(ref(db, "orders"));
  if (!ordersSnap.exists()) return null;

  const root = ordersSnap.val() || {};

  for (const [uid, userOrders] of Object.entries(root)) {
    if (!userOrders || typeof userOrders !== "object") continue;

    for (const [key, order] of Object.entries(userOrders)) {
      if (!order || typeof order !== "object") continue;

      const storedId = String(order.orderId || order.id || key);

      if (key === orderId || storedId === orderId) {
        return {
          path: `orders/${uid}/${key}`,
          data: order
        };
      }
    }
  }

  return null;
}

function renderItems(items) {
  if (!items.length) {
    return `
      <div class="rounded-xl border border-dashed p-5 text-sm text-slate-500">
        No products were recorded for this order.
      </div>
    `;
  }

  return `
    <div class="divide-y rounded-xl border">
      ${items.map(item => {
        const image = getItemImage(item);
        const name = escapeHtml(getItemName(item));
        const qty = getItemQuantity(item);
        const price = getItemPrice(item);

        return `
          <div class="flex gap-4 p-4">
            <div class="h-16 w-16 shrink-0 overflow-hidden rounded-xl bg-slate-100">
              ${
                image
                  ? `<img src="${escapeHtml(image)}"
                          alt="${name}"
                          class="h-full w-full object-cover"
                          loading="lazy"
                          onerror="this.style.display='none'">`
                  : `<div class="flex h-full w-full items-center justify-center text-slate-400">
                       <i class="bi bi-image text-xl"></i>
                     </div>`
              }
            </div>

            <div class="min-w-0 flex-1">
              <p class="font-bold text-slate-900">${name}</p>
              <p class="mt-1 text-sm text-slate-500">
                Quantity: ${qty}
              </p>
              <p class="mt-1 text-xs font-semibold text-slate-500" data-live-stock="${escapeHtml(String(item.productId || item.id || item.name || ""))}">
                Current stock: loading...
              </p>
            </div>

            <div class="text-right font-bold text-slate-900">
              ${money(price * qty)}
              ${
                qty > 1
                  ? `<div class="text-xs font-normal text-slate-500">
                       ${money(price)} each
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderOrder(orderId, data, path) {
  const rawStatus = String(data.status || "pending").toLowerCase();
  const status = ["processing", "shipped"].includes(rawStatus)
    ? "confirmed"
    : rawStatus;
  const paymentStatus =
    String(data.paymentStatus || "pending").toLowerCase();

  const items = normalizeItems(data.items);
  const subtotal =
    Number(data.subtotal ?? data.subTotal ?? 0) ||
    items.reduce(
      (sum, item) => sum + getItemPrice(item) * getItemQuantity(item),
      0
    );

  const total = Number(data.total ?? subtotal) || 0;

  const customerName =
    data.customerName ||
    data.name ||
    "Customer";

  const customerEmail =
    data.customerEmail ||
    data.email ||
    "-";

  const customerPhone =
    data.customerPhone ||
    data.phone ||
    "-";

  const shippingAddress =
    typeof data.shippingAddress === "object"
      ? Object.values(data.shippingAddress || {})
          .filter(Boolean)
          .join(", ")
      : (data.shippingAddress || "-");

  orderBox.dataset.path = path;

  orderBox.innerHTML = `
    <div class="space-y-6">

      <div class="flex flex-col gap-4 border-b pb-5 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <p class="text-xs font-bold uppercase tracking-[.2em] text-blue-700">
            Order Details
          </p>
          <h2 class="mt-1 break-all text-2xl font-black text-slate-950 sm:text-3xl">
            #${escapeHtml(orderId)}
          </h2>
          <p class="mt-1 text-sm text-slate-500">
            Placed ${formatDate(data.createdAt)}
          </p>
        </div>

        <div class="rounded-2xl bg-blue-50 px-5 py-3 sm:text-right">
          <p class="text-xs font-bold uppercase tracking-wider text-blue-700">
            Total
          </p>
          <p class="text-xl font-black text-blue-950">
            ${money(total)}
          </p>
        </div>
      </div>

      <div class="grid gap-5 lg:grid-cols-3">

        <section class="rounded-2xl border p-5">
          <h3 class="mb-4 text-lg font-black">Customer</h3>
          <dl class="space-y-3 text-sm">
            <div>
              <dt class="text-slate-500">Name</dt>
              <dd class="font-semibold">${escapeHtml(customerName)}</dd>
            </div>
            <div>
              <dt class="text-slate-500">Email</dt>
              <dd class="break-all font-semibold">${escapeHtml(customerEmail)}</dd>
            </div>
            <div>
              <dt class="text-slate-500">Phone</dt>
              <dd class="font-semibold">${escapeHtml(customerPhone)}</dd>
            </div>
            <div>
              <dt class="text-slate-500">User ID</dt>
              <dd class="break-all font-mono text-xs">${escapeHtml(data.userId || path.split("/")[1] || "-")}</dd>
            </div>
          </dl>
        </section>

        <section class="rounded-2xl border p-5 lg:col-span-2">
          <h3 class="mb-4 text-lg font-black">Shipping Address</h3>
          <p class="whitespace-pre-line text-sm leading-6 text-slate-700">
            ${escapeHtml(shippingAddress)}
          </p>
        </section>

      </div>

      <section>
        <div class="mb-3 flex items-center justify-between gap-3">
          <h3 class="text-lg font-black">Products</h3>
          <span class="text-sm text-slate-500">
            ${items.length} item${items.length === 1 ? "" : "s"}
          </span>
        </div>

        ${renderItems(items)}
      </section>

      <section class="grid gap-5 lg:grid-cols-2">

        <div class="rounded-2xl border p-5">
          <h3 class="mb-4 text-lg font-black">Order Summary</h3>

          <div class="space-y-3 text-sm">
            <div class="flex justify-between gap-4">
              <span class="text-slate-500">Subtotal</span>
              <strong>${money(subtotal)}</strong>
            </div>

            <div class="flex justify-between gap-4 border-t pt-3 text-base">
              <span class="font-black">Total</span>
              <strong class="text-blue-800">${money(total)}</strong>
            </div>
          </div>
        </div>

        <div class="rounded-2xl border p-5">
          <h3 class="mb-4 text-lg font-black">Update Order</h3>

          <div class="grid gap-4 sm:grid-cols-2">

            <label class="block text-sm font-bold">
              Order status
              <select id="status"
                      class="mt-2 w-full rounded-xl border border-slate-300 bg-white p-3 outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-100">
                ${STATUS_OPTIONS.map(option => `
                  <option value="${option}" ${option === status ? "selected" : ""}>
                    ${option.charAt(0).toUpperCase() + option.slice(1)}
                  </option>
                `).join("")}
              </select>
            </label>

            <label class="block text-sm font-bold">
              Payment status
              <select id="paymentStatus"
                      class="mt-2 w-full rounded-xl border border-slate-300 bg-white p-3 outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-100">
                ${PAYMENT_OPTIONS.map(option => `
                  <option value="${option}" ${option === paymentStatus ? "selected" : ""}>
                    ${option.charAt(0).toUpperCase() + option.slice(1)}
                  </option>
                `).join("")}
              </select>
            </label>

          </div>

          <button id="saveOrder"
                  type="button"
                  class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-blue-800 px-5 py-3 font-bold text-white transition hover:bg-blue-900 disabled:cursor-not-allowed disabled:opacity-60">
            <i class="bi bi-check2-circle"></i>
            <span>Save Changes</span>
          </button>
        </div>

      </section>
    </div>
  `;

  document.getElementById("saveOrder").addEventListener("click", async () => {
    const button = document.getElementById("saveOrder");
    const statusSelect = document.getElementById("status");
    const paymentSelect = document.getElementById("paymentStatus");

    button.disabled = true;
    button.innerHTML = `
      <i class="bi bi-arrow-repeat animate-spin"></i>
      <span>Saving...</span>
    `;

    try {
      const nextStatus = statusSelect.value;
      const updates = {
        status: nextStatus,
        paymentStatus: paymentSelect.value,
        updatedAt: Date.now()
      };

      await update(ref(db, path), updates);

      await Swal.fire({
        icon: "success",
        title: "Order Updated",
        text: "The order and payment status have been saved.",
        confirmButtonColor: "#1d4ed8"
      });
    } catch (error) {
      console.error("Order update error:", error);

      await Swal.fire({
        icon: "error",
        title: "Update Failed",
        text: `The order status and payment status could not be saved (${error?.code || "unknown error"}). Publish the latest database rules and try again.`,
        confirmButtonColor: "#1d4ed8"
      });
    } finally {
      button.disabled = false;
      button.innerHTML = `
        <i class="bi bi-check2-circle"></i>
        <span>Save Changes</span>
      `;

      refreshLiveStock(items);
    }

    async function refreshLiveStock(items) {
      try {
        const snapshot = await get(ref(db, "products"));
        const records = snapshot.exists() ? snapshot.val() || {} : {};
        const findProduct = item => {
          const requestedId = String(item.productId || item.id || "");
          const name = String(item.name || item.productName || "").trim().toLowerCase();
          if (records[requestedId]) return records[requestedId];
          const match = Object.entries(records).find(([key, product]) =>
            String(product?.id || product?.productId || "") === requestedId ||
            (name && String(product?.name || "").trim().toLowerCase() === name)
          );
          return match ? match[1] : null;
        };
        document.querySelectorAll("[data-live-stock]").forEach(element => {
          const item = items.find(entry => String(entry.productId || entry.id || entry.name || "") === element.dataset.liveStock);
          const product = item ? findProduct(item) : null;
          element.textContent = product && Number.isFinite(Number(product.stock))
            ? `Current stock: ${Number(product.stock)}`
            : "Current stock: unavailable";
        });
      } catch (error) {
        document.querySelectorAll("[data-live-stock]").forEach(element => {
          element.textContent = "Current stock: unavailable";
        });
        console.warn("Live stock refresh failed:", error?.code || error?.message);
      }
    }
  });
}

async function initPage() {
  const orderId = getRequestedOrderId();

  if (!orderId) {
    orderBox.innerHTML = `
      <div class="py-10 text-center">
        <i class="bi bi-receipt text-4xl text-slate-300"></i>
        <h2 class="mt-4 text-xl font-black">No order selected</h2>
        <p class="mt-2 text-sm text-slate-500">
          Open this page with an order ID, for example:
          <code>?id=ORDER_ID</code>.
        </p>
        <a href="admin-orders.html"
           class="mt-5 inline-flex rounded-xl bg-blue-800 px-5 py-3 font-bold text-white hover:bg-blue-900">
          Back to Orders
        </a>
      </div>
    `;
    return;
  }

  orderBox.innerHTML = `
    <div class="flex items-center justify-center gap-3 py-12 text-slate-500">
      <i class="bi bi-arrow-repeat animate-spin text-xl"></i>
      <span>Loading order...</span>
    </div>
  `;

  try {
    const result = await findOrder(orderId, getRequestedUserId());

    if (!result) {
      orderBox.innerHTML = `
        <div class="py-10 text-center">
          <i class="bi bi-receipt-cutoff text-4xl text-slate-300"></i>
          <h2 class="mt-4 text-xl font-black">Order not found</h2>
          <p class="mt-2 text-sm text-slate-500">
            No order matching
            <strong>#${escapeHtml(orderId)}</strong>
            could be found.
          </p>
          <a href="admin-orders.html"
             class="mt-5 inline-flex rounded-xl bg-blue-800 px-5 py-3 font-bold text-white hover:bg-blue-900">
            Back to Orders
          </a>
        </div>
      `;
      return;
    }

    renderOrder(orderId, result.data, result.path);
  } catch (error) {
    console.error("Order loading error:", error);

    orderBox.innerHTML = `
      <div class="py-10 text-center">
        <i class="bi bi-wifi-off text-4xl text-red-300"></i>
        <h2 class="mt-4 text-xl font-black">Unable to load order</h2>
        <p class="mt-2 text-sm text-slate-500">
          Check your internet connection and Firebase Realtime Database permissions, then try again.
        </p>
        <button type="button" id="retryOrder"
                class="mt-5 rounded-xl bg-blue-800 px-5 py-3 font-bold text-white hover:bg-blue-900">
          Try Again
        </button>
      </div>
    `;

    document.getElementById("retryOrder")?.addEventListener("click", initPage);
  }
}

async function doSignOut() {
  const result = await Swal.fire({
    icon: "question",
    title: "Sign out of admin portal?",
    text: "You will need to sign in again to continue.",
    showCancelButton: true,
    confirmButtonText: "Sign Out",
    cancelButtonText: "Stay",
    confirmButtonColor: "#1d4ed8"
  });

  if (!result.isConfirmed) return;

  try {
    await signOut(auth);
    location.replace("admin-login.html");
  } catch (error) {
    console.error("Sign-out error:", error);

    Swal.fire({
      icon: "error",
      title: "Sign Out Failed",
      text: "Please try again.",
      confirmButtonColor: "#1d4ed8"
    });
  }
}

document.querySelectorAll("[data-signout]")
  .forEach(button => button.addEventListener("click", doSignOut));

const drawer = document.getElementById("drawer");
const shade = document.getElementById("shade");

document.getElementById("openMenu")?.addEventListener("click", () => {
  drawer?.classList.add("open");
  shade?.classList.remove("hidden");
});

function closeDrawer() {
  drawer?.classList.remove("open");
  shade?.classList.add("hidden");
}

document.getElementById("closeMenu")?.addEventListener("click", closeDrawer);
shade?.addEventListener("click", closeDrawer);

document.querySelectorAll("#drawer a").forEach(link => {
  link.addEventListener("click", closeDrawer);
});

onAuthStateChanged(auth, async user => {
  protectedApp.classList.add("hidden");

  try {
    const authorized = await requireAdmin(user);

    if (!authorized) return;

    protectedApp.classList.remove("hidden");
    await initPage();
  } catch (error) {
    console.error("Admin authorization error:", error);

    await Swal.fire({
      icon: "error",
      title: "Unable to verify access",
      text: "Please check your connection and try again.",
      confirmButtonColor: "#1d4ed8"
    });
  }
});
</script>
