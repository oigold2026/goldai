<main id="protectedApp" class="hidden lg:ml-72">
  <div class="mx-auto max-w-[1600px] p-4 pb-28 sm:p-6 sm:pb-28">

<div class="mb-5"><h2 class="text-2xl font-black">Product</h2><p class="text-sm text-slate-500">Images are uploaded to Cloudinary; product data is stored in Realtime Database.</p></div>
<form id="productForm" class="card max-w-3xl space-y-5 rounded-2xl border bg-white p-6">
<label class="block text-sm font-bold">Product name<input id="name" required class="mt-2 w-full rounded-xl border p-3"></label>
<label class="block text-sm font-bold">Category<input id="category" required class="mt-2 w-full rounded-xl border p-3"></label>
<label class="block text-sm font-bold">Description<textarea id="description" rows="4" class="mt-2 w-full rounded-xl border p-3"></textarea></label>
<div class="grid gap-4 sm:grid-cols-2"><label class="block text-sm font-bold">Price (UGX)<input id="price" type="number" min="0" required class="mt-2 w-full rounded-xl border p-3"></label><label class="block text-sm font-bold">Stock<input id="stock" type="number" min="0" required class="mt-2 w-full rounded-xl border p-3"></label></div>
<label class="flex items-center gap-2 text-sm font-semibold"><input id="featured" type="checkbox"> Featured product</label>
<label class="block text-sm font-bold">Product images<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple class="mt-2 w-full rounded-xl border p-3"><span class="mt-1 block text-xs text-slate-500">Maximum 5 MB per image.</span></label>
<div id="existingImages" class="flex flex-wrap gap-2"></div>
<button type="submit" id="saveBtn" class="w-full rounded-xl bg-blue-800 p-3 font-bold text-white">Save Product</button>
</form>

  </div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBK-HHFid2F9SY1rtGsSO3boUFZihyOpTQ",
  authDomain: "goldai-58550.firebaseapp.com",
  projectId: "goldai-58550",databaseURL:"https://goldai-58550-default-rtdb.firebaseio.com",
  storageBucket: "goldai-58550.firebasestorage.app",
  messagingSenderId: "726592521265",
  appId: "1:726592521265:web:8aca7282b6b4aec8c9c110",
  measurementId: "G-23MEZJVM6Z"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const productForm = document.getElementById("productForm");
const saveBtn = document.getElementById("saveBtn");
const nameInput = document.getElementById("name");
const categoryInput = document.getElementById("category");
const descriptionInput = document.getElementById("description");
const priceInput = document.getElementById("price");
const stockInput = document.getElementById("stock");
const featuredInput = document.getElementById("featured");
const imagesInput = document.getElementById("images");

async function requireAdmin(user){
  if(!user){ location.replace("admin-login.html"); return false; }
  const userProfile = await get(ref(db, "users/" + user.uid));
  const userData = userProfile.exists() ? userProfile.val() : null;
  if(!userData || userData.role !== "admin"){
    await Swal.fire({icon:"error", title:"Access Denied", text:"This account is not authorized to use the admin portal.", confirmButtonColor:"#1d4ed8"});
    location.replace("admin-login.html");
    return false;
  }
  const name = userData.name || user.displayName || user.email || "Admin";
  document.querySelectorAll("[data-admin-name]").forEach(el => el.textContent = name);
  const photo = userData.photoURL || user.photoURL;
  if(photo){
    document.querySelectorAll("[data-admin-avatar]").forEach(img => { img.src = photo; img.classList.remove("hidden"); });
    document.querySelectorAll("[data-avatar-icon]").forEach(i => i.classList.add("hidden"));
  }
  return true;
}

onAuthStateChanged(auth, async user => {
  try{
    if(await requireAdmin(user)){
      document.getElementById("protectedApp").classList.remove("hidden");
      await initPage();
    }
  }catch(error){
    console.error("Admin authorization error:", error);
    Swal.fire({icon:"error", title:"Unable to verify access", text:"Please check your connection and try again.", confirmButtonColor:"#1d4ed8"});
  }
});

async function doSignOut(){
  const result = await Swal.fire({
    icon:"question", title:"Sign out of admin portal?",
    text:"You will need to sign in again to continue.",
    showCancelButton:true, confirmButtonText:"Sign Out", cancelButtonText:"Stay",
    confirmButtonColor:"#1d4ed8"
  });
  if(result.isConfirmed){ await signOut(auth); location.replace("admin-login.html"); }
}
document.querySelectorAll("[data-signout]").forEach(btn => btn.addEventListener("click", doSignOut));

const drawer = document.getElementById("drawer");
const shade = document.getElementById("shade");
document.getElementById("openMenu")?.addEventListener("click", () => {drawer.classList.add("open"); shade.classList.remove("hidden");});
document.getElementById("closeMenu")?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});
shade?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});


const CLOUDINARY_UPLOAD_URL="https://api.cloudinary.com/v1_1/garfgnqe/image/upload";
const CLOUDINARY_PRESET="kanyeseries";
async function uploadImage(file){
 if(file.size>5*1024*1024) throw new Error("Each image must be 5 MB or smaller.");
 const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",CLOUDINARY_PRESET);
 const response=await fetch(CLOUDINARY_UPLOAD_URL,{method:"POST",body:fd});
 if(!response.ok) throw new Error("Cloudinary image upload failed.");
 const data=await response.json(); if(!data.secure_url) throw new Error("Cloudinary did not return an image URL.");
 return data.secure_url;
}
productForm.addEventListener("submit",async e=>{
 e.preventDefault(); saveBtn.disabled=true; saveBtn.textContent="Saving...";
 try{
  const urls=[]; for(const file of imagesInput.files) urls.push(await uploadImage(file));
  const id=crypto.randomUUID();
  await set(ref(db,"products/"+id),{
    id,
    name:nameInput.value.trim(),
    category:categoryInput.value.trim(),
    description:descriptionInput.value.trim(),
    price:Number(priceInput.value),
    stock:Number(stockInput.value),
    images:urls,
    featured:featuredInput.checked,
    createdAt:Date.now(),
    updatedAt:Date.now()
  });
  location.replace("admin-products.html");
 }catch(err){console.error(err);Swal.fire({icon:"error",title:"Unable to save product",text:err.message,confirmButtonColor:"#1d4ed8"});}
 finally{saveBtn.disabled=false;saveBtn.textContent="Save Product";}
});
async function initPage(){}

</script>
