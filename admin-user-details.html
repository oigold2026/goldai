<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBK-HHFid2F9SY1rtGsSO3boUFZihyOpTQ",
  authDomain: "goldai-58550.firebaseapp.com",
  projectId: "goldai-58550",databaseURL:"https://goldai-58550-default-rtdb.firebaseio.com",
  storageBucket: "goldai-58550.firebasestorage.app",
  messagingSenderId: "726592521265",
  appId: "1:726592521265:web:8aca7282b6b4aec8c9c110",
  measurementId: "G-23MEZJVM6Z"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

async function requireAdmin(user){
  if(!user){ location.replace("admin-login.html"); return false; }
  const userProfile = await get(ref(db, "users/" + user.uid));
  const userData = userProfile.exists() ? userProfile.val() : null;
  if(!userData || userData.role !== "admin"){
    await Swal.fire({icon:"error", title:"Access Denied", text:"This account is not authorized to use the admin portal.", confirmButtonColor:"#1d4ed8"});
    location.replace("admin-login.html");
    return false;
  }
  const name = userData.name || user.displayName || user.email || "Admin";
  document.querySelectorAll("[data-admin-name]").forEach(el => el.textContent = name);
  const photo = userData.photoURL || user.photoURL;
  if(photo){
    document.querySelectorAll("[data-admin-avatar]").forEach(img => { img.src = photo; img.classList.remove("hidden"); });
    document.querySelectorAll("[data-avatar-icon]").forEach(i => i.classList.add("hidden"));
  }
  return true;
}

onAuthStateChanged(auth, async user => {
  try{
    if(await requireAdmin(user)){
      document.getElementById("protectedApp").classList.remove("hidden");
      await initPage();
    }
  }catch(error){
    console.error("Admin authorization error:", error);
    Swal.fire({icon:"error", title:"Unable to verify access", text:"Please check your connection and try again.", confirmButtonColor:"#1d4ed8"});
  }
});

async function doSignOut(){
  const result = await Swal.fire({
    icon:"question", title:"Sign out of admin portal?",
    text:"You will need to sign in again to continue.",
    showCancelButton:true, confirmButtonText:"Sign Out", cancelButtonText:"Stay",
    confirmButtonColor:"#1d4ed8"
  });
  if(result.isConfirmed){ await signOut(auth); location.replace("admin-login.html"); }
}
document.querySelectorAll("[data-signout]").forEach(btn => btn.addEventListener("click", doSignOut));

const drawer = document.getElementById("drawer");
const shade = document.getElementById("shade");
document.getElementById("openMenu")?.addEventListener("click", () => {drawer.classList.add("open"); shade.classList.remove("hidden");});
document.getElementById("closeMenu")?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});
shade?.addEventListener("click", () => {drawer.classList.remove("open"); shade.classList.add("hidden");});


async function initPage(){
 const id=new URLSearchParams(location.search).get("id");const s=await get(ref(db,"users/"+id));
 if(!s.exists()){userBox.textContent="User not found.";return;}
 const u=s.val();userBox.innerHTML=`<div class="flex items-center gap-4 border-b pb-5"><div class="flex h-16 w-16 items-center justify-center overflow-hidden rounded-full bg-blue-50 text-blue-800">${u.photoURL?`<img src="${u.photoURL}" alt="" class="h-full w-full object-cover">`:`<i class="bi bi-person-fill text-2xl"></i>`}</div><div><h2 class="text-xl font-black">${u.name||"Unnamed customer"}</h2><p class="text-sm text-slate-500">${u.email||"ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â"}</p></div></div><dl class="space-y-4 pt-5"><div><dt class="text-xs text-slate-500">Phone</dt><dd class="font-semibold">${u.phone||"ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â"}</dd></div><div><dt class="text-xs text-slate-500">Role</dt><dd class="font-semibold capitalize">${u.role||"customer"}</dd></div><div><dt class="text-xs text-slate-500">UID</dt><dd class="break-all font-mono text-sm">${u.uid||id}</dd></div></dl>`;
}

</script>
